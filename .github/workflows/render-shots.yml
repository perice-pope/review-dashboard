name: Render Runway Shots

# Polls production_queue for shots with status IN ('queued','revision_needed')
# and renders them via Runway Gen-4. Idempotent — the script itself filters,
# so back-to-back runs are safe.

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:        # manual trigger from the Actions tab

concurrency:
  group: render-shots
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: runner/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render pending shots
        env:
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL     }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY     }}
          RUNWAY_API_KEY:   ${{ secrets.RUNWAY_API_KEY   }}
          DRIVE_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_URL  }}
        run: python3 run_batch_runway.py --auto
