<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Dashboard — The Roommates</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1419; color: #e8d5b0; padding: 24px; min-height: 100vh; }

  /* Header */
  header { margin-bottom: 28px; }
  h1 { color: #c45a2c; font-size: 28px; margin-bottom: 6px; letter-spacing: -0.5px; }
  .subtitle { color: #5b8a7a; font-size: 14px; margin-bottom: 20px; }

  /* Controls */
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .song-select { background: #1a2535; color: #e8d5b0; border: 1px solid #2b3d52; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .song-select:focus { border-color: #5b8a7a; outline: none; }

  /* Summary */
  .summary-bar { display: flex; gap: 16px; flex-wrap: wrap; }
  .summary-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .summary-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-approved { background: #2d8a4e; }
  .dot-pending { background: #d4a355; }
  .dot-rejected { background: #8b3a1f; }
  .dot-in-post { background: #5b8a7a; }
  .dot-revision { background: #c45a2c; }
  .dot-needs-keyframe { background: #b87333; }

  /* Compose Keyframe card (status=needs_keyframe) */
  .compose-card { background: #1a1410; border: 1px dashed #b87333; border-radius: 10px; padding: 16px; margin-top: 8px; max-width: 680px; }
  .compose-card h3 { color: #e8a060; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.6px; }
  .compose-card .compose-hint { color: #a08066; font-size: 12px; margin-bottom: 12px; line-height: 1.55; }
  .compose-card .compose-section-label { font-size: 10px; color: #d4a355; font-weight: 700; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .compose-card .compose-prompt { background: #080503; border: 1px solid #4a3520; padding: 9px 11px; border-radius: 5px; font-size: 11px; color: #d8b890; font-family: 'Courier New', monospace; line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow-y: auto; }
  .compose-card .compose-meta { font-size: 11px; color: #8a7060; }
  .compose-card .compose-meta b { color: #d4a355; }
  .compose-card .compose-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .compose-card input.compose-input { flex: 1; min-width: 240px; background: #080503; color: #e8d5b0; border: 1px solid #4a3520; padding: 8px 10px; border-radius: 5px; font-size: 11px; font-family: 'Courier New', monospace; }
  .compose-card input.compose-input:focus { border-color: #b87333; outline: none; }
  .compose-card .btn-runway { background: #b87333; color: #1a1410; border: none; padding: 8px 14px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
  .compose-card .btn-runway:hover { opacity: 0.85; }
  .compose-card .btn-copy { background: #4a3520; color: #e8d5b0; border: none; padding: 6px 12px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .compose-card .btn-copy:hover { background: #5a4530; }
  .compose-card .btn-apply { background: #2d8a4e; color: white; border: none; padding: 8px 14px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .compose-card .btn-apply:hover { opacity: 0.85; }
  .compose-card .btn-apply:disabled { opacity: 0.4; cursor: not-allowed; }
  .compose-card .compose-steps { list-style: decimal inside; padding-left: 0; margin: 8px 0 14px; color: #c8a880; font-size: 12px; line-height: 1.7; }
  .compose-card .compose-steps li { margin-bottom: 4px; }
  .compose-card .compose-steps code { background: #2a1f10; color: #e8a060; padding: 1px 5px; border-radius: 3px; font-size: 11px; font-family: 'Courier New', monospace; }
  .compose-card .compose-warn { color: #ff8a5a; }
  .compose-card .compose-fineprint { color: #8a7060; font-size: 11px; line-height: 1.6; margin-top: 6px; }
  .compose-card .compose-fineprint code { background: #2a1f10; padding: 1px 4px; border-radius: 3px; font-size: 10px; font-family: 'Courier New', monospace; color: #c8a880; }

  /* Composition kit (auto-generated for ensemble shots) */
  .kit-section { background: #221813; border: 1px solid #4a3520; border-radius: 8px; padding: 12px; margin-top: 12px; }
  .kit-title { font-size: 11px; color: #e8a060; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .kit-grid { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .kit-asset { width: 120px; text-align: center; }
  .kit-asset img { width: 120px; height: 200px; object-fit: cover; border-radius: 5px; background: #050b14; cursor: pointer; border: 1px solid #4a3520; transition: border-color 0.15s; }
  .kit-asset img:hover { border-color: #b87333; }
  .kit-asset .kit-label { font-size: 11px; color: #d4a355; font-weight: 700; margin-top: 4px; }
  .kit-asset .kit-failed { width: 120px; height: 200px; border-radius: 5px; background: #2a0a0a; border: 1px dashed #8b3a1f; display: flex; align-items: center; justify-content: center; color: #e8a060; font-size: 11px; padding: 10px; text-align: center; }
  .kit-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn-kit-photopea { background: #5b8a7a; color: white; border: none; padding: 8px 14px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn-kit-photopea:hover { opacity: 0.85; }
  .btn-kit-copy { background: #4a3520; color: #e8d5b0; border: none; padding: 6px 12px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .btn-kit-copy:hover { background: #5a4530; }

  /* Still card (LoRA-generated keyframe + edit + animate controls) */
  .still-card { background: #0d1a2a; border: 1px solid #2b5d82; border-radius: 10px; padding: 14px; margin: 10px 0; max-width: 720px; display: flex; gap: 14px; align-items: flex-start; }
  .still-card.pending { border-style: dashed; opacity: 0.85; }
  .still-card-img-wrap { flex: 0 0 180px; }
  .still-card-img { width: 180px; max-height: 320px; aspect-ratio: 9/16; object-fit: cover; border-radius: 7px; background: #050b14; display: block; cursor: pointer; }
  .still-card-img-placeholder { width: 180px; height: 320px; border-radius: 7px; background: #050b14; display: flex; align-items: center; justify-content: center; color: #5b8a7a; font-size: 12px; text-align: center; padding: 12px; }
  .still-card-body { flex: 1; min-width: 0; }
  .still-card-label { font-size: 11px; color: #a0c8e8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .still-card-prompt { width: 100%; min-height: 80px; resize: vertical; background: #050b14; color: #e8d5b0; border: 1px solid #2b5d82; padding: 8px 10px; border-radius: 5px; font-size: 11px; font-family: 'Courier New', monospace; line-height: 1.45; }
  .still-card-prompt:focus { border-color: #5b8a7a; outline: none; }
  .still-card-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .still-card-row select { background: #050b14; color: #e8d5b0; border: 1px solid #2b5d82; padding: 6px 8px; border-radius: 5px; font-size: 11px; }
  .btn-still-regen { background: #c45a2c; color: white; border: none; padding: 8px 14px; border-radius: 5px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-still-regen:hover { opacity: 0.85; }
  .btn-still-regen:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-still-animate { background: #2d8a4e; color: white; border: none; padding: 8px 16px; border-radius: 5px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-still-animate:hover { opacity: 0.85; }
  .btn-still-animate:disabled { opacity: 0.4; cursor: not-allowed; }
  .still-status-msg { font-size: 11px; color: #a0c8e8; font-style: italic; }
  .still-card-meta { font-size: 11px; color: #6a8aaa; margin-top: 6px; }
  .compose-card .compose-or { color: #6a5040; font-size: 11px; text-align: center; margin: 10px 0; letter-spacing: 0.4px; text-transform: uppercase; }
  .compose-card .compose-drop { border: 2px dashed #4a3520; border-radius: 8px; padding: 18px 14px; text-align: center; color: #a08066; cursor: pointer; transition: all 0.15s; font-size: 12px; }
  .compose-card .compose-drop:hover, .compose-card .compose-drop.dragover { border-color: #b87333; background: #221813; color: #e8a060; }
  .compose-card .compose-drop input[type="file"] { display: none; }
  .compose-card .compose-drop b { color: #d4a355; }
  .compose-card .compose-uploading { color: #5b8a7a; font-size: 12px; }

  .btn-download { background: #2b3d52; color: #e8d5b0; border: 1px solid #5b8a7a; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
  .btn-download:hover { background: #3a4d62; }

  .btn-refresh { background: #1a2535; color: #5b8a7a; border: 1px solid #5b8a7a; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
  .btn-refresh:hover { background: #2b3d52; }

  /* Filter bar */
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .filter-btn { background: #1a2535; color: #e8d5b0; border: 1px solid #2b3d52; padding: 7px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
  .filter-btn:hover { border-color: #5b8a7a; }
  .filter-btn.active { background: #c45a2c; border-color: #c45a2c; color: white; }

  /* Shot cards */
  .shots-grid { display: grid; gap: 24px; }
  .shot-card { background: #1a2535; border-radius: 12px; padding: 20px; border: 1px solid #2b3d52; transition: border-color 0.2s; }
  .shot-card:hover { border-color: #5b8a7a; }
  .shot-card.border-approved { border-left: 3px solid #2d8a4e; }
  .shot-card.border-rejected { border-left: 3px solid #8b3a1f; }
  .shot-card.border-in_post { border-left: 3px solid #d4a355; }
  .shot-card.border-revision_needed { border-left: 3px solid #c45a2c; }
  .shot-card.border-complete, .shot-card.border-shipped { border-left: 3px solid #1a5a2a; }

  /* Status select dropdown */
  .status-select { background: #0f1419; color: #e8d5b0; border: 1px solid #2b3d52; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .status-select:focus { border-color: #5b8a7a; outline: none; }

  .shot-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .shot-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .shot-name { font-size: 17px; font-weight: 700; color: #f5e6c8; }
  .concept-tag { background: #c45a2c; color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .cost-tag { background: #1a3a2a; color: #5b8a7a; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .song-tag { font-size: 11px; color: #5b8a7a; }

  .status-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .status-generated, .status-review_pending, .status-queued, .status-generating { background: #2b3d52; color: #e8d5b0; }
  .status-approved { background: #2d8a4e; color: white; }
  .status-rejected, .status-failed { background: #8b3a1f; color: white; }
  .status-in_post, .status-in_assembly { background: #d4a355; color: #1a2535; }
  .status-revision_needed { background: #c45a2c; color: white; }
  .status-needs_keyframe { background: #b87333; color: white; }
  .status-still_pending { background: #2b5d82; color: white; }
  .status-still_review { background: #2b5d82; color: white; }
  .status-animating { background: #5b8a7a; color: white; }

  /* Song header — top-level grouping when viewing multiple songs */
  .song-header { display: flex; align-items: baseline; gap: 14px; padding: 22px 14px 10px; margin-top: 36px; border-top: 3px solid #c45a2c; flex-wrap: wrap; }
  .song-header:first-of-type { margin-top: 8px; }
  .song-header-title { font-size: 22px; font-weight: 800; color: #f5e6c8; letter-spacing: -0.3px; }
  .song-header-pill { background: #c45a2c; color: white; padding: 3px 10px; border-radius: 14px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .song-header-meta { font-size: 12px; color: #8aa098; }

  /* Scene header — separates scene groups in the editorial assembly order */
  .scene-header { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px 6px; margin-top: 18px; border-top: 1px solid #2b3d52; flex-wrap: wrap; }
  .scene-header:first-of-type, .song-header + .scene-header { margin-top: 6px; border-top: 0; }
  .scene-label { font-size: 13px; font-weight: 700; color: #d4a355; letter-spacing: 0.5px; text-transform: uppercase; }
  .scene-meta { font-size: 11px; color: #5b8a7a; }

  /* Shot-type badge */
  .shot-type-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
  .shot-type-establishing      { background: #1a3a4a; color: #6acdef; }
  .shot-type-character_single  { background: #2a1a3a; color: #c8a0e8; }
  .shot-type-two_shot          { background: #3a1a2a; color: #e8a0c8; }
  .shot-type-ensemble          { background: #3a2a1a; color: #e8c890; }
  .shot-type-insert            { background: #1a3a2a; color: #80d8a0; }
  .shot-type-performance       { background: #3a1a1a; color: #e89090; }
  .shot-type-match_cut         { background: #2a2a1a; color: #d8d890; }

  /* Position-in-scene indicator */
  .shot-order-tag { font-size: 10px; color: #5b8a7a; font-weight: 600; font-family: 'Courier New', monospace; }
  .duration-tag { font-size: 10px; color: #d4a355; font-weight: 600; }
  .status-final_review { background: #5b8a7a; color: white; }
  .status-complete, .status-shipped { background: #1a5a2a; color: white; }

  .director-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; }
  .director-pending { background: #2a2000; color: #d4a355; border: 1px solid #d4a355; }
  .director-approved { background: #0a2a0a; color: #2d8a4e; border: 1px solid #2d8a4e; }

  /* Video cards */
  .videos-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .video-card { background: #0f1419; border-radius: 8px; padding: 10px; border: 2px solid #2b3d52; width: 200px; transition: border-color 0.2s; position: relative; }
  .video-card video { width: 100%; border-radius: 5px; margin-bottom: 7px; display: block; background: #000; }
  .no-video { height: 90px; display: flex; align-items: center; justify-content: center; color: #5b8a7a; font-size: 12px; }
  .char-name { font-size: 12px; font-weight: 700; color: #d4a355; }
  .tool-name { font-size: 10px; color: #5b8a7a; margin-top: 1px; }
  .file-name { font-size: 10px; color: #5b8a7a; margin-top: 2px; word-break: break-all; line-height: 1.3; }
  .expiry-warning { display: none; background: #2a1a00; border: 1px solid #c45a2c; border-radius: 4px; padding: 4px 8px; font-size: 10px; color: #e8a060; margin-top: 4px; cursor: pointer; }
  .expiry-warning.show { display: block; }
  .expiry-warning:hover { background: #3a2810; }
  .drive-iframe { width: 100%; aspect-ratio: 9/16; border: 0; border-radius: 5px; background: #000; margin-bottom: 7px; display: block; }

  .btn-row { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }
  .btn { padding: 5px 8px; border-radius: 5px; border: none; cursor: pointer; font-size: 10px; font-weight: 700; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.82; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-approve { background: #2d8a4e; color: white; }
  .btn-reject { background: #8b3a1f; color: white; }
  .btn-copy { background: #2b3d52; color: #e8d5b0; }

  .feedback-input { width: 100%; margin-top: 6px; padding: 6px 8px; background: #080d12; color: #e8d5b0; border: 1px solid #2b3d52; border-radius: 5px; font-size: 11px; font-family: inherit; resize: vertical; min-height: 38px; }
  .feedback-input:focus { border-color: #c45a2c; outline: none; }
  .feedback-input::placeholder { color: #5b8a7a; font-style: italic; }

  /* Revision modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #1a2535; border: 1px solid #5b8a7a; border-radius: 12px; padding: 22px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { color: #c45a2c; font-size: 18px; margin-bottom: 4px; }
  .modal .modal-subtitle { color: #5b8a7a; font-size: 12px; margin-bottom: 16px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field-label { font-size: 11px; color: #d4a355; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-field-old { background: #2a0a0a; border: 1px solid #5a1a1a; padding: 8px 10px; border-radius: 5px; font-size: 12px; color: #c89a8a; white-space: pre-wrap; word-break: break-word; margin-bottom: 4px; font-family: 'Courier New', monospace; line-height: 1.5; }
  .modal-field-new { background: #0a2a0a; border: 1px solid #1a5a2a; padding: 8px 10px; border-radius: 5px; font-size: 12px; color: #b0e8b0; white-space: pre-wrap; word-break: break-word; font-family: 'Courier New', monospace; line-height: 1.5; }
  .modal-field-edit { width: 100%; background: #080d12; color: #e8d5b0; border: 1px solid #5b8a7a; padding: 8px 10px; border-radius: 5px; font-size: 12px; font-family: 'Courier New', monospace; resize: vertical; min-height: 80px; }
  .modal-rationale { background: #0a1a2a; border: 1px solid #2b5d82; padding: 10px 12px; border-radius: 5px; font-size: 12px; color: #a0c8e8; line-height: 1.55; }
  .modal-feedback { background: #2a1a00; border: 1px solid #c45a2c; padding: 10px 12px; border-radius: 5px; font-size: 12px; color: #e8a060; line-height: 1.55; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
  .modal-btn { padding: 9px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 700; transition: opacity 0.15s; }
  .modal-btn:hover { opacity: 0.85; }
  .modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .modal-btn-apply { background: #2d8a4e; color: white; }
  .modal-btn-edit { background: #5b8a7a; color: white; }
  .modal-btn-cancel { background: #2b3d52; color: #e8d5b0; }
  .modal-loading { text-align: center; padding: 30px; color: #5b8a7a; font-size: 13px; }

  /* CapCut & Director sections */
  .capcut-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #2b3d52; }
  .section-toggle { background: #2b3d52; color: #e8d5b0; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 8px; }
  .section-toggle:hover { background: #3a4d62; }
  .toggle-notes { display: none; margin-top: 10px; background: #080d12; padding: 12px; border-radius: 7px; font-size: 11px; line-height: 1.65; max-height: 300px; overflow-y: auto; color: #8ab; font-family: 'Courier New', monospace; white-space: pre-wrap; word-break: break-word; }
  .toggle-notes.open { display: block; }

  .missing-asset { background: #2a1a00; border: 1px solid #c45a2c; border-radius: 6px; padding: 8px 12px; margin-top: 8px; font-size: 11px; color: #e8a060; }

  /* Shot actions */
  .shot-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn-shot { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 700; transition: opacity 0.15s; }
  .btn-shot:hover { opacity: 0.82; }
  .btn-shot:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-shot-approve { background: #2d8a4e; color: white; }
  .btn-shot-in-post { background: #d4a355; color: #1a2535; }
  .btn-shot-director { background: #5b8a7a; color: white; }

  /* Toast */
  .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 1000; transform: translateY(-20px); opacity: 0; transition: all 0.3s; pointer-events: none; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast-success { background: #2d8a4e; color: white; }
  .toast-error { background: #8b3a1f; color: white; }

  .loading { text-align: center; padding: 60px; color: #5b8a7a; font-size: 14px; }
  .spinner { border: 3px solid #2b3d52; border-top: 3px solid #c45a2c; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { text-align: center; padding: 60px; color: #5b8a7a; font-size: 14px; }
  .error-state { background: #2a0a0a; border: 1px solid #8b3a1f; border-radius: 8px; padding: 16px; margin: 20px 0; color: #e8a060; font-size: 13px; }

  @media (max-width: 768px) {
    body { padding: 16px; }
    h1 { font-size: 22px; }
    .video-card { width: 150px; }
    .controls { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<header>
  <h1>THE ROOMMATES</h1>
  <p class="subtitle" id="subtitle">Review Dashboard</p>
  <div class="controls" id="controls" style="display:none">
    <select class="song-select" id="song-filter"></select>
    <div class="summary-bar" id="summary-bar"></div>
    <button class="btn-download" onclick="downloadApproved()">Download Approved Manifest</button>
    <button class="btn-refresh" onclick="loadData()">Refresh now</button>
    <span id="live-indicator" style="font-size:11px;color:#5b8a7a;margin-left:4px;font-weight:600">● live</span>
  </div>
</header>

<div class="filter-bar" id="filter-bar" style="display:none"></div>
<div id="toast" class="toast"></div>

<div class="modal-overlay" id="revision-modal">
  <div class="modal" id="revision-modal-body">
    <div class="modal-loading"><div class="spinner"></div>Asking Claude for a revision proposal…</div>
  </div>
</div>

<div class="shots-grid" id="grid">
  <div class="loading"><div class="spinner"></div>Loading shots...</div>
</div>

<script>
var API_URL = 'https://xrtyllishxovdpazjdco.supabase.co/functions/v1/review-dashboard';
var currentFilter = 'all';
var currentSongId = 'all';
var allData = { songs: [], shots: [], runs: [] };

// ── Cost rates ──
var COST_RATES = { kling: 0.028, omnihuman: 0.05 };

function estimateCost(runs) {
  var total = 0;
  for (var i = 0; i < runs.length; i++) {
    var r = runs[i];
    if (!r.duration_seconds || !r.tool_used) continue;
    var tool = r.tool_used.toLowerCase();
    var rate = 0.03;
    for (var k in COST_RATES) { if (tool.indexOf(k) !== -1) { rate = COST_RATES[k]; break; } }
    total += r.duration_seconds * rate;
  }
  return Math.round(total * 100) / 100;
}

// ── Helpers ──
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast toast-' + (type || 'success') + ' show';
  setTimeout(function() { el.classList.remove('show'); }, 3000);
}

// ── API ──
function apiCall(body) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(res) {
    if (!res.ok) return res.json().catch(function() { return {}; }).then(function(e) { throw new Error(e.error || 'Request failed'); });
    return res.json();
  });
}

// ── Load data ──
// Two modes: foreground (shows the spinner, used for first paint + manual
// refresh) and background (silent, used by the auto-refresh poll so it doesn't
// flash a spinner every 12 seconds while you're reviewing).
var lastFetchTime = null;
var dataDirty = false;   // set when an action is in flight; suppresses background diff

function loadData(opts) {
  opts = opts || {};
  var background = !!opts.background;
  var grid = document.getElementById('grid');
  if (!background) {
    grid.innerHTML = '<div class="loading"><div class="spinner"></div>Loading shots...</div>';
  }
  var prevScrollY = window.scrollY;

  return fetch(API_URL)
    .then(function(res) {
      if (!res.ok) throw new Error('API returned ' + res.status);
      return res.json();
    })
    .then(function(data) {
      allData = data;
      lastFetchTime = Date.now();
      renderAll();
      if (background) {
        // Restore scroll position so the page doesn't jump on the user mid-review
        window.scrollTo({ top: prevScrollY, behavior: 'instant' });
      }
      updateLiveIndicator();
    })
    .catch(function(err) {
      if (!background) {
        grid.innerHTML = '<div class="error-state">Could not load data: ' + esc(err.message) + '</div>';
      } else {
        // Silent fail in background — show a stale indicator instead
        var el = document.getElementById('live-indicator');
        if (el) { el.textContent = 'Update failed — will retry'; el.style.color = '#e8a060'; }
      }
    });
}

// ── Auto-refresh polling ──
// Polls every 12s while the tab is visible. Pauses when you tab away (Page
// Visibility API) so we don't burn API calls in the background. Snaps back to
// a fresh fetch the moment the tab regains focus.
var POLL_INTERVAL_MS = 12000;
var pollTimer = null;

function startAutoRefresh() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function() {
    if (document.visibilityState === 'visible') {
      loadData({ background: true });
    }
  }, POLL_INTERVAL_MS);
}

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') {
    loadData({ background: true });   // immediate refresh on tab return
  }
});

function updateLiveIndicator() {
  var el = document.getElementById('live-indicator');
  if (!el || !lastFetchTime) return;
  var secs = Math.round((Date.now() - lastFetchTime) / 1000);
  var label = secs < 5  ? 'just now'
            : secs < 60 ? secs + 's ago'
            : Math.floor(secs / 60) + 'm ago';
  el.textContent = '● live · updated ' + label;
  el.style.color = secs < 30 ? '#5b8a7a' : '#a08066';
}
// Tick the indicator every second so it stays current even between polls
setInterval(updateLiveIndicator, 1000);

// ── Render ──
function renderAll() {
  var songs = allData.songs || [];
  var shots = allData.shots || [];
  var runs = allData.runs || [];

  // Build song lookup
  var songMap = {};
  for (var i = 0; i < songs.length; i++) songMap[songs[i].id] = songs[i].song_title;

  // Group runs by production_queue_id
  var runMap = {};
  for (var i = 0; i < runs.length; i++) {
    var r = runs[i];
    if (!runMap[r.production_queue_id]) runMap[r.production_queue_id] = [];
    runMap[r.production_queue_id].push(r);
  }

  // Count statuses
  var counts = { approved: 0, pending: 0, rejected: 0, in_post: 0, revision_needed: 0, needs_keyframe: 0, still_review: 0, total: shots.length };
  for (var i = 0; i < shots.length; i++) {
    var s = shots[i].status;
    if (s === 'approved') counts.approved++;
    else if (s === 'rejected') counts.rejected++;
    else if (s === 'in_post' || s === 'in_assembly') counts.in_post++;
    else if (s === 'revision_needed') counts.revision_needed++;
    else if (s === 'needs_keyframe') counts.needs_keyframe++;
    else if (s === 'still_review') counts.still_review++;
    else counts.pending++;
  }

  // Subtitle
  var dateStr = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  document.getElementById('subtitle').textContent = 'Review Dashboard \u2014 ' + dateStr;

  // Song filter
  var sel = document.getElementById('song-filter');
  sel.innerHTML = '<option value="all">All Songs</option>';
  for (var i = 0; i < songs.length; i++) {
    sel.innerHTML += '<option value="' + songs[i].id + '">' + esc(songs[i].song_title) + '</option>';
  }
  sel.value = currentSongId;
  sel.onchange = function() { currentSongId = sel.value; applyFilters(); };

  // Summary
  document.getElementById('summary-bar').innerHTML =
    '<div class="summary-item"><span class="summary-dot dot-approved"></span> ' + counts.approved + ' Approved</div>' +
    '<div class="summary-item"><span class="summary-dot dot-pending"></span> ' + counts.pending + ' Pending</div>' +
    '<div class="summary-item"><span class="summary-dot dot-needs-keyframe"></span> ' + counts.needs_keyframe + ' Needs Keyframe</div>' +
    '<div class="summary-item"><span class="summary-dot dot-revision"></span> ' + counts.revision_needed + ' Revision</div>' +
    '<div class="summary-item"><span class="summary-dot dot-in-post"></span> ' + counts.in_post + ' In Post</div>' +
    '<div class="summary-item"><span class="summary-dot dot-rejected"></span> ' + counts.rejected + ' Rejected</div>';

  // Filter bar
  var fb = document.getElementById('filter-bar');
  fb.innerHTML =
    '<button class="filter-btn' + (currentFilter === 'all' ? ' active' : '') + '" onclick="setFilter(\'all\',this)">All (' + counts.total + ')</button>' +
    '<button class="filter-btn' + (currentFilter === 'pending' ? ' active' : '') + '" onclick="setFilter(\'pending\',this)">Pending</button>' +
    '<button class="filter-btn' + (currentFilter === 'still_review' ? ' active' : '') + '" onclick="setFilter(\'still_review\',this)">Still Review (' + counts.still_review + ')</button>' +
    '<button class="filter-btn' + (currentFilter === 'needs_keyframe' ? ' active' : '') + '" onclick="setFilter(\'needs_keyframe\',this)">Needs Keyframe</button>' +
    '<button class="filter-btn' + (currentFilter === 'revision_needed' ? ' active' : '') + '" onclick="setFilter(\'revision_needed\',this)">Revision Needed</button>' +
    '<button class="filter-btn' + (currentFilter === 'approved' ? ' active' : '') + '" onclick="setFilter(\'approved\',this)">Approved</button>' +
    '<button class="filter-btn' + (currentFilter === 'in_post' ? ' active' : '') + '" onclick="setFilter(\'in_post\',this)">In Post</button>' +
    '<button class="filter-btn' + (currentFilter === 'rejected' ? ' active' : '') + '" onclick="setFilter(\'rejected\',this)">Rejected</button>';

  // Show controls
  document.getElementById('controls').style.display = 'flex';
  fb.style.display = 'flex';

  // Render shot cards
  if (!shots.length) {
    document.getElementById('grid').innerHTML = '<div class="empty-state">No shots found in production_queue.</div>';
    return;
  }

  // Sort shots into editorial assembly order: by song, then scene_index
  // (the AUTHORED scene order — UUID lex-order has no relation to song-section
  // progression), then shot_order. Shots with no scene_id appear under a
  // synthetic "Unscheduled" group at the bottom.
  shots = shots.slice().sort(function(a, b) {
    var pad = function(v) { return v != null ? String(v).padStart(6, '0') : '￿'; };
    var sa = (a.song_id || '') + ' ' + pad(a.scene_index) + ' ' + (a.scene_id || '￿') + ' ' + pad(a.shot_order) + ' ' + (a.created_at || '');
    var sb = (b.song_id || '') + ' ' + pad(b.scene_index) + ' ' + (b.scene_id || '￿') + ' ' + pad(b.shot_order) + ' ' + (b.created_at || '');
    return sa < sb ? -1 : sa > sb ? 1 : 0;
  });

  // Pre-compute scene groupings + per-scene aggregate stats so the editor can
  // see at a glance how long each scene runs and where they are in approval.
  var sceneStats = {};
  for (var k = 0; k < shots.length; k++) {
    var sid = shots[k].scene_id || ('__unscene__' + (shots[k].song_id || 'none'));
    if (!sceneStats[sid]) sceneStats[sid] = { total: 0, approved: 0, target: 0, song_id: shots[k].song_id || '' };
    sceneStats[sid].total += 1;
    if (shots[k].status === 'approved') sceneStats[sid].approved += 1;
    var d = shots[k].target_duration_seconds || shots[k].duration_seconds || 0;
    sceneStats[sid].target += Number(d) || 0;
  }

  // Per-song aggregates + per-song scene numbering. Walk shots in editorial
  // order so scene numbers come out 1, 2, 3 in play order within each song.
  var songStats = {};      // song_id → { total, approved, target, sceneCount }
  var sceneNumByKey = {};  // scene_key → 1-indexed scene number within its song
  for (var k = 0; k < shots.length; k++) {
    var sh = shots[k];
    var songId = sh.song_id || '';
    var sceneKeyK = sh.scene_id || ('__unscene__' + songId);
    if (!songStats[songId]) songStats[songId] = { total: 0, approved: 0, target: 0, sceneCount: 0, scenesSeen: {} };
    songStats[songId].total += 1;
    if (sh.status === 'approved') songStats[songId].approved += 1;
    var d2 = sh.target_duration_seconds || sh.duration_seconds || 0;
    songStats[songId].target += Number(d2) || 0;
    if (!songStats[songId].scenesSeen[sceneKeyK]) {
      songStats[songId].sceneCount += 1;
      songStats[songId].scenesSeen[sceneKeyK] = songStats[songId].sceneCount;
    }
    sceneNumByKey[sceneKeyK] = songStats[songId].scenesSeen[sceneKeyK];
  }

  var html = '';
  var lastSongId = null;
  var lastSceneKey = null;
  for (var i = 0; i < shots.length; i++) {
    var shot = shots[i];
    var sceneKey = shot.scene_id || ('__unscene__' + (shot.song_id || 'none'));
    var songId = shot.song_id || '';

    // Song header — emitted on song change. Visually separates each song's
    // editorial timeline so the VA never wonders which song a scene belongs to.
    if (songId !== lastSongId) {
      var sStats = songStats[songId] || { total: 0, approved: 0, target: 0, sceneCount: 0 };
      var songTitle = songMap[songId] || 'Unknown Song';
      html += '<div class="song-header" data-song-id="' + (songId || '') + '">';
      html += '<span class="song-header-pill">Song</span>';
      html += '<span class="song-header-title">' + esc(songTitle) + '</span>';
      html += '<span class="song-header-meta">';
      html += sStats.sceneCount + ' scene' + (sStats.sceneCount === 1 ? '' : 's');
      html += ' · ' + sStats.total + ' shot' + (sStats.total === 1 ? '' : 's');
      html += ' · ~' + Math.round(sStats.target) + 's target runtime';
      html += ' · ' + sStats.approved + '/' + sStats.total + ' approved';
      html += '</span>';
      html += '</div>';
      lastSongId = songId;
      lastSceneKey = null;  // reset so the next scene header always renders
    }

    // Scene header — emitted on scene change. Now uses sequential numbers
    // (Scene 1, Scene 2, …) instead of UUID prefixes.
    if (sceneKey !== lastSceneKey) {
      var stats = sceneStats[sceneKey];
      var sNum = sceneNumByKey[sceneKey];
      var label = shot.scene_id ? ('Scene ' + sNum) : 'Unscheduled';
      html += '<div class="scene-header" data-song-id="' + (songId || '') + '" data-scene-key="' + esc(sceneKey) + '">';
      html += '<span class="scene-label">' + esc(label) + '</span>';
      html += '<span class="scene-meta">' + stats.total + ' shot' + (stats.total === 1 ? '' : 's');
      html += ' · ' + Math.round(stats.target) + 's target';
      html += ' · ' + stats.approved + '/' + stats.total + ' approved';
      var section = shot.audio_section_used;
      if (section) html += ' · ' + esc(section);
      html += '</span>';
      html += '</div>';
      lastSceneKey = sceneKey;
    }
    var shotRuns = runMap[shot.id] || [];
    var songTitle = songMap[shot.song_id] || 'Unknown Song';
    var cost = estimateCost(shotRuns);
    var dirStatus = shot.director_signoff_status || 'pending';
    var dirBadge = dirStatus === 'approved' ? 'Director approved' : 'Awaiting director';
    var capcut = shot.capcut_notes ? JSON.stringify(shot.capcut_notes, null, 2) : 'No CapCut notes yet.';
    var missingNote = (shot.capcut_notes && shot.capcut_notes.missing_assets_note) || '';
    var dirSignoff = shot.director_signoff ? JSON.stringify(shot.director_signoff, null, 2) : '';
    var driveFolderUrl = shot.drive_folder_url || '';
    var borderedStatuses = ['approved', 'rejected', 'in_post', 'revision_needed', 'complete', 'shipped'];
    var borderClass = (borderedStatuses.indexOf(shot.status) !== -1) ? ' border-' + shot.status : '';

    // Video cards
    var vhtml = '';
    if (shotRuns.length === 0) {
      vhtml = '<div style="color:#5b8a7a;font-size:12px;padding:8px">No videos generated yet</div>';
    } else {
      for (var j = 0; j < shotRuns.length; j++) {
        var run = shotRuns[j];
        vhtml += '<div class="video-card" id="run-' + run.id + '" data-drive-folder-url="' + esc(driveFolderUrl) + '" data-drive-filename="' + esc(run.drive_filename || '') + '">';
        if (run.video_url) {
          vhtml += '<video src="' + esc(run.video_url) + '" controls preload="metadata" playsinline onerror="showExpiry(this)"></video>';
          vhtml += '<div class="expiry-warning" onclick="refreshRun(\'' + run.id + '\',this)" title="Click to load the Drive copy">fal link expired \u2014 click to load Drive copy</div>';
        } else {
          vhtml += '<div class="no-video">No video yet</div>';
        }
        vhtml += '<div class="char-name">' + esc(run.character_name || 'Unknown') + '</div>';
        vhtml += '<div class="tool-name">' + esc(run.tool_used || '') + (run.duration_seconds ? ' (' + run.duration_seconds + 's)' : '') + '</div>';
        vhtml += '<div class="file-name">' + esc(run.drive_filename || '') + '</div>';
        vhtml += '<textarea class="feedback-input" id="feedback-' + run.id + '" placeholder="Feedback for Redo (e.g. \'characters look wrong, no smoke from mouth, push in slower\') — Claude will regenerate the keyframe with the character/setting refs and re-animate" rows="2"></textarea>';
        vhtml += '<div class="btn-row">';
        vhtml += '<button class="btn btn-approve" onclick="reviewRun(\'' + run.id + '\',\'approve\',this)">Good</button>';
        vhtml += '<button class="btn btn-reject" onclick="reviewRun(\'' + run.id + '\',\'reject\',this)">Redo</button>';
        if (run.drive_filename) vhtml += '<button class="btn btn-copy" onclick="copyDriveInfo(this)">Drive URL</button>';
        vhtml += '</div></div>';
      }
    }

    html += '<div class="shot-card' + borderClass + '" data-status="' + shot.status + '" data-song-id="' + (shot.song_id || '') + '" data-scene-key="' + esc(sceneKey) + '" data-shot-id="' + shot.id + '">';
    html += '<div class="shot-header"><div class="shot-meta">';
    if (shot.shot_order != null) {
      html += '<span class="shot-order-tag">#' + shot.shot_order + '</span>';
    }
    html += '<span class="shot-name">' + esc(shot.shot_name) + '</span>';
    if (shot.shot_type) {
      html += '<span class="shot-type-badge shot-type-' + esc(shot.shot_type) + '">' + esc(shot.shot_type) + '</span>';
    }
    var dur = shot.target_duration_seconds || shot.duration_seconds;
    if (dur) {
      html += '<span class="duration-tag">' + Math.round(Number(dur) * 10) / 10 + 's</span>';
    }
    html += '<span class="status-badge status-' + shot.status + '">' + shot.status + '</span>';
    html += '<span class="director-badge director-' + dirStatus + '">' + dirBadge + '</span>';
    if (cost > 0) html += '<span class="cost-tag">~$' + cost.toFixed(2) + '</span>';
    html += '</div><div style="display:flex;gap:6px;align-items:center">';
    if (shot.concept_tag) html += '<span class="concept-tag">' + esc(shot.concept_tag) + '</span>';
    html += '<span class="song-tag">' + esc(songTitle) + '</span>';
    html += '</div></div>';

    // Compose-Keyframe card (shows when status=needs_keyframe instead of regenerating)
    if (shot.status === 'needs_keyframe') {
      html += renderComposeCard(shot);
    }

    // Still card — Stage 1 output. Shows for still_pending / still_review,
    // or any time a LoRA-generated still exists, so the user can re-edit/animate.
    var stillStatuses = ['still_pending', 'still_review', 'animating'];
    if (shot.keyframe_image_url || stillStatuses.indexOf(shot.status) !== -1) {
      html += renderStillCard(shot);
    }

    html += '<div class="videos-row">' + vhtml + '</div>';

    if (missingNote) html += '<div class="missing-asset">' + esc(missingNote) + '</div>';

    // CapCut + Director sections
    html += '<div class="capcut-section">';
    html += '<button class="section-toggle" onclick="toggleNext(this)">CapCut Edit Guide</button>';
    html += '<pre class="toggle-notes">' + esc(capcut) + '</pre>';
    if (dirSignoff) {
      html += '<button class="section-toggle" onclick="toggleNext(this)">Director Notes</button>';
      html += '<pre class="toggle-notes">' + esc(dirSignoff) + '</pre>';
    }
    html += '</div>';

    // Shot actions — status dropdown + director button
    var allStatuses = ['queued','still_pending','still_review','needs_keyframe','animating','generating','generated','review_pending','revision_needed','approved','rejected','in_assembly','in_post','final_review','complete','shipped'];
    var statusLabels = {queued:'Queued',still_pending:'Still Generating',still_review:'Still Review',needs_keyframe:'Needs Keyframe',animating:'Animating',generating:'Generating',generated:'Generated',review_pending:'Review Pending',revision_needed:'Revision Needed',approved:'Approved',rejected:'Rejected',in_assembly:'In Assembly',in_post:'In Post',final_review:'Final Review',complete:'Complete',shipped:'Shipped'};
    html += '<div class="shot-actions">';
    html += '<select class="status-select" onchange="changeStatus(\'' + shot.id + '\',this.value)">';
    for (var si = 0; si < allStatuses.length; si++) {
      var sv = allStatuses[si];
      html += '<option value="' + sv + '"' + (shot.status === sv ? ' selected' : '') + '>' + statusLabels[sv] + '</option>';
    }
    html += '</select>';
    if (dirStatus !== 'approved') html += '<button class="btn-shot btn-shot-director" onclick="approveDirector(\'' + shot.id + '\')">Approve Director Signoff</button>';
    html += '</div></div>';
  }

  // ── Keyed reconciliation (React-style, vanilla) ──
  // Instead of nuking grid.innerHTML, parse the new HTML, walk top-level
  // children, and for each one find the matching existing node by stable key.
  // If the new outerHTML is identical, MOVE the existing node into the new
  // position (no DOM churn — keeps video state, scroll, focus, typed input).
  // If it differs, swap in the new node. Net: only changed cards re-render.
  var grid = document.getElementById('grid');
  var temp = document.createElement('div');
  temp.innerHTML = html;
  var newChildren = Array.from(temp.children);

  function keyFor(el) {
    if (!el || !el.classList) return null;
    if (el.classList.contains('shot-card'))   return 'shot:'  + (el.getAttribute('data-shot-id')   || '');
    if (el.classList.contains('song-header')) return 'song:'  + (el.getAttribute('data-song-id')   || '');
    if (el.classList.contains('scene-header')) return 'scene:' + (el.getAttribute('data-song-id') || '') + ':' + (el.getAttribute('data-scene-key') || '');
    return null;
  }

  // Index existing children so we can look them up by key
  var existingByKey = {};
  Array.from(grid.children).forEach(function(el) {
    var k = keyFor(el);
    if (k) existingByKey[k] = el;
  });

  // Build the new order by reusing unchanged existing nodes verbatim
  var fragment = document.createDocumentFragment();
  newChildren.forEach(function(newEl) {
    var k = keyFor(newEl);
    if (k && existingByKey[k] && existingByKey[k].outerHTML === newEl.outerHTML) {
      // No content change — move the existing live node into the new position.
      // Preserves video playback, focus, typed text, scroll state.
      fragment.appendChild(existingByKey[k]);
    } else {
      fragment.appendChild(newEl);
    }
  });
  grid.replaceChildren(fragment);
  applyFilters();
}

// ── Filtering ──
function setFilter(filter, btn) {
  currentFilter = filter;
  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  var pendingStatuses = ['queued', 'generating', 'generated', 'review_pending'];
  var inPostStatuses = ['in_post', 'in_assembly'];
  var cards = document.querySelectorAll('.shot-card');
  var visibleSongs = {};
  var visibleScenes = {};

  // 1. Toggle each shot card; remember which songs/scenes have at least one
  //    visible card so we can hide their headers if all cards are filtered out.
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var status = card.getAttribute('data-status');
    var songId = card.getAttribute('data-song-id');
    var sceneKey = card.getAttribute('data-scene-key');
    var matchesStatus = currentFilter === 'all'
      || (currentFilter === 'pending' && pendingStatuses.indexOf(status) !== -1)
      || (currentFilter === 'in_post' && inPostStatuses.indexOf(status) !== -1)
      || status === currentFilter;
    var matchesSong = currentSongId === 'all' || songId === currentSongId;
    var visible = matchesStatus && matchesSong;
    card.style.display = visible ? '' : 'none';
    if (visible) {
      if (songId)   visibleSongs[songId] = true;
      if (sceneKey) visibleScenes[sceneKey] = true;
    }
  }

  // 2. Hide song banners whose songs have no visible cards. Filtered-out songs
  //    fully collapse — including their banner — so the visible song lifts to
  //    the top of the scrollport.
  var songHeaders = document.querySelectorAll('.song-header');
  for (var i = 0; i < songHeaders.length; i++) {
    var sid = songHeaders[i].getAttribute('data-song-id');
    songHeaders[i].style.display = visibleSongs[sid] ? '' : 'none';
  }

  // 3. Hide scene headers similarly — applies for status filters that may hide
  //    every shot in a scene even though the song is visible.
  var sceneHeaders = document.querySelectorAll('.scene-header');
  for (var i = 0; i < sceneHeaders.length; i++) {
    var sk = sceneHeaders[i].getAttribute('data-scene-key');
    sceneHeaders[i].style.display = visibleScenes[sk] ? '' : 'none';
  }

  // 4. Snap the viewport to the top so the user lands at the visible block.
  //    Skipping when the filter is 'all' to avoid jumping during plain reloads.
  if (currentFilter !== 'all' || currentSongId !== 'all') {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
}

// ── Actions ──
function reviewRun(id, action) {
  var card = document.getElementById('run-' + id);
  var btns = card.querySelectorAll('.btn');

  if (action === 'reject') {
    var fbEl = document.getElementById('feedback-' + id);
    var feedback = fbEl ? fbEl.value.trim() : '';

    if (!feedback) {
      if (!confirm('Redo with no feedback? Runway will re-render with the same prompt and likely produce the same result. Type feedback above for an AI-revised prompt.')) {
        return;
      }
      for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
      apiCall({ action: 'review_run', run_id: id, status: 'reject' }).then(function() {
        card.style.borderColor = '#8b3a1f';
        toast('Run marked for redo (no feedback)');
      }).catch(function(err) {
        for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
        toast(err.message, 'error');
      });
      return;
    }

    requestRevision(id, feedback, btns);
    return;
  }

  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
  apiCall({ action: 'review_run', run_id: id, status: 'approve' }).then(function() {
    card.style.borderColor = '#2d8a4e';
    toast('Run approved');
  }).catch(function(err) {
    for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
    toast(err.message, 'error');
  });
}

// ── AI revision flow ──
function requestRevision(runId, feedback, cardBtns) {
  for (var i = 0; i < cardBtns.length; i++) cardBtns[i].disabled = true;
  openModalLoading();
  apiCall({ action: 'request_revision', run_id: runId, feedback: feedback })
    .then(function(resp) {
      renderRevisionModal(resp);
    })
    .catch(function(err) {
      closeModal();
      for (var i = 0; i < cardBtns.length; i++) cardBtns[i].disabled = false;
      toast('Revision proposal failed: ' + err.message, 'error');
    });
}

function openModalLoading() {
  document.getElementById('revision-modal-body').innerHTML =
    '<div class="modal-loading"><div class="spinner"></div>Asking Claude for a revision proposal…</div>';
  document.getElementById('revision-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('revision-modal').classList.remove('open');
}

function renderRevisionModal(resp) {

  var current = resp.current || {};
  var proposed = resp.proposed || {};
  var html = '';
  html += '<h2>AI Revision Proposal</h2>';
  html += '<div class="modal-subtitle">Claude has proposed updated fields. On apply, the runner regenerates a still keyframe (using up to 3 reference images: characters first, then setting if room) and animates it. Review the diff before applying.</div>';

  html += '<div class="modal-field"><div class="modal-field-label">Your Feedback</div>';
  html += '<div class="modal-feedback">' + esc(resp.feedback || '') + '</div></div>';

  html += '<div class="modal-field"><div class="modal-field-label">runway_prompt — current</div>';
  html += '<div class="modal-field-old">' + esc(current.runway_prompt || '(empty)') + '</div>';
  html += '<div class="modal-field-label">runway_prompt — proposed</div>';
  html += '<textarea class="modal-field-edit" id="modal-prompt" rows="6">' + esc(proposed.runway_prompt || '') + '</textarea></div>';

  html += '<div class="modal-field"><div class="modal-field-label">characters_used — current</div>';
  html += '<div class="modal-field-old">' + esc(current.characters_used || '(empty)') + '</div>';
  html += '<div class="modal-field-label">characters_used — proposed (order matters; only first 3 get reference-bound)</div>';
  html += '<input class="modal-field-edit" id="modal-characters" style="min-height:auto" value="' + esc(proposed.characters_used || '') + '"></div>';

  html += '<div class="modal-field"><div class="modal-field-label">scene_ref — current</div>';
  html += '<div class="modal-field-old">' + esc(current.scene_ref || '(empty)') + '</div>';
  html += '<div class="modal-field-label">scene_ref — proposed (slug only, e.g. kitchen_morning; leave blank for none)</div>';
  html += '<input class="modal-field-edit" id="modal-scene" style="min-height:auto" value="' + esc(proposed.scene_ref || '') + '"></div>';

  html += '<div class="modal-field"><div class="modal-field-label">Rationale</div>';
  html += '<div class="modal-rationale">' + esc(proposed.rationale || '') + '</div></div>';

  html += '<div class="modal-actions">';
  html += '<button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>';
  if (current.keyframe_image_url) {
    html += '<button class="modal-btn modal-btn-edit" onclick="recomposeFromModal(\'' + resp.shot_id + '\')" title="Clears the locked keyframe and forces a new compose pass — use when characters look wrong">Recompose Keyframe</button>';
  }
  html += '<button class="modal-btn modal-btn-apply" id="modal-apply-btn" onclick="applyRevision(\'' + resp.shot_id + '\',\'' + resp.run_id + '\',\'' + esc(resp.feedback || '').replace(/\\/g,"\\\\").replace(/'/g,"\\'") + '\')">Apply &amp; Resubmit</button>';
  html += '</div>';

  body.innerHTML = html;

function applyRevision(shotId, runId, feedback) {
  var promptEl = document.getElementById('modal-prompt');
  var charsEl  = document.getElementById('modal-characters');
  var sceneEl  = document.getElementById('modal-scene');
  var btn = document.getElementById('modal-apply-btn');
  if (btn) btn.disabled = true;

  apiCall({
    action: 'apply_revision',
    shot_id: shotId,
    run_id: runId,
    runway_prompt: promptEl.value,
    characters_used: charsEl.value,
    scene_ref: sceneEl ? sceneEl.value : '',
    feedback: feedback
  }).then(function(resp) {
    closeModal();
    if (resp && resp.render_triggered) {
      toast('Revision applied — render started, ~3 min');
    } else {
      var why = resp && resp.render_trigger_reason ? ' (' + resp.render_trigger_reason + ')' : '';
      toast('Revision applied — cron will pick up within 5 min' + why);
    }
    loadData();
  }).catch(function(err) {
    if (btn) btn.disabled = false;
    toast('Apply failed: ' + err.message, 'error');
  });
}

function changeStatus(id, status) {
  apiCall({ action: 'change_status', shot_id: id, status: status }).then(function() {
    toast('Status changed to ' + status);
    loadData();
  }).catch(function(err) { toast(err.message, 'error'); });
}

function approveDirector(id) {
  apiCall({ action: 'approve_director', shot_id: id }).then(function() {
    toast('Director signoff approved');
    loadData();
  }).catch(function(err) { toast(err.message, 'error'); });
}

// ── Still card (Stage 1: LoRA-generated keyframe + Animate gate) ──
function renderStillCard(shot) {
  var status = shot.status || '';
  var still = shot.keyframe_image_url || '';
  // Convert bare Drive ID or drive.google.com URL into the lh3 thumbnail form
  // so the <img> can render directly. Pass-through for other URLs.
  var imgSrc = '';
  if (still) {
    var driveIdMatch = still.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{20,})/);
    if (driveIdMatch) imgSrc = 'https://lh3.googleusercontent.com/d/' + driveIdMatch[1] + '=s2048';
    else if (/^[A-Za-z0-9_-]{20,}$/.test(still)) imgSrc = 'https://lh3.googleusercontent.com/d/' + still + '=s2048';
    else imgSrc = still;
  }

  var pending = (status === 'still_pending');
  var animating = (status === 'animating');
  var canAnimate = !!still && !pending && !animating;

  var html = '<div class="still-card' + (pending ? ' pending' : '') + '">';

  // Image preview / placeholder
  html += '<div class="still-card-img-wrap">';
  if (imgSrc) {
    html += '<img class="still-card-img" src="' + esc(imgSrc) + '" ';
    html += 'onclick="window.open(\'' + esc(imgSrc) + '\',\'_blank\')" ';
    html += 'alt="Generated still" loading="lazy">';
  } else if (pending) {
    html += '<div class="still-card-img-placeholder">Generating still…<br>~30–60s</div>';
  } else {
    html += '<div class="still-card-img-placeholder">No still yet</div>';
  }
  html += '</div>';

  // Body — prompt editor + buttons
  html += '<div class="still-card-body">';
  html += '<div class="still-card-label">Stage 1 — Still keyframe';
  if (pending) html += ' <span class="still-status-msg">(generating…)</span>';
  else if (animating) html += ' <span class="still-status-msg">(animating clip…)</span>';
  else if (status === 'still_review') html += ' <span class="still-status-msg">(review and approve)</span>';
  html += '</div>';

  html += '<textarea class="still-card-prompt" id="still-prompt-' + shot.id + '" ';
  html += 'placeholder="Edit the prompt to regenerate the still (LoRA character names like MAYA_RM stay automatic)">';
  html += esc(shot.runway_prompt || '');
  html += '</textarea>';

  html += '<div class="still-card-row">';
  // Animation model selector — Seedance 2 default, gen4.5 / veo3.1 alternates
  html += '<label style="font-size:11px;color:#a0c8e8;">Animator:</label>';
  html += '<select id="still-model-' + shot.id + '">';
  var animModel = shot.animation_model || 'seedance2';
  var models = [['seedance2', 'Seedance 2 (default)'], ['gen4.5', 'Runway Gen-4.5'], ['veo3.1', 'Veo 3.1']];
  for (var mi = 0; mi < models.length; mi++) {
    html += '<option value="' + models[mi][0] + '"' + (animModel === models[mi][0] ? ' selected' : '') + '>' + models[mi][1] + '</option>';
  }
  html += '</select>';
  html += '<button class="btn-still-regen" ';
  html += (pending || animating ? 'disabled ' : '');
  html += 'onclick="regenerateStill(\'' + shot.id + '\',this)">Regenerate Still</button>';
  html += '<button class="btn-still-animate" ';
  html += (canAnimate ? '' : 'disabled ');
  html += 'onclick="animateStill(\'' + shot.id + '\',this)">Animate This Still →</button>';
  html += '</div>';

  if (still) {
    html += '<div class="still-card-meta">Keyframe: <code>' + esc(still.length > 60 ? still.substring(0, 60) + '…' : still) + '</code></div>';
  }
  html += '</div>';   // body
  html += '</div>';   // card
  return html;
}

function regenerateStill(shotId, btn) {
  var promptEl = document.getElementById('still-prompt-' + shotId);
  if (btn) btn.disabled = true;
  apiCall({
    action: 'regenerate_still',
    shot_id: shotId,
    runway_prompt: promptEl ? promptEl.value : undefined,
  }).then(function(resp) {
    toast(resp && resp.render_triggered ? 'Regenerating still — ~60s' : 'Queued — cron will pick up');
    loadData();
  }).catch(function(err) {
    if (btn) btn.disabled = false;
    toast('Regenerate failed: ' + err.message, 'error');
  });
}

function animateStill(shotId, btn) {
  var promptEl = document.getElementById('still-prompt-' + shotId);
  var modelEl  = document.getElementById('still-model-' + shotId);
  if (btn) btn.disabled = true;
  apiCall({
    action: 'animate_still',
    shot_id: shotId,
    runway_prompt: promptEl ? promptEl.value : undefined,
    animation_model: modelEl ? modelEl.value : undefined,
  }).then(function(resp) {
    toast(resp && resp.render_triggered ? 'Animating — ~3 min' : 'Queued — cron will pick up');
    loadData();
  }).catch(function(err) {
    if (btn) btn.disabled = false;
    toast('Animate failed: ' + err.message, 'error');
  });
}

// ── Compose Keyframe card (Path B handoff) ──
function renderComposeCard(shot) {
  var prompt = shot.runway_prompt || '';
  var chars = (shot.characters_used || '').split(',').map(function(s){return s.trim();}).filter(Boolean);
  var scene = shot.scene_ref || '';
  var existing = shot.keyframe_image_url || '';

  var html = '<div class="compose-card" data-shot-id="' + shot.id + '">';
  html += '<h3>Compose Keyframe — ' + chars.length + ' character' + (chars.length===1?'':'s') + ' needed</h3>';

  // Composition kit — auto-generated for ensemble (3+ char) shots. Shows
  // the backdrop + each character solo PNG so the user can compose them
  // together in Photopea/Photoshop without having to generate the pieces.
  var kit = shot.composition_kit;
  if (kit && (kit.backdrop_url || (kit.characters && kit.characters.length))) {
    html += renderCompositionKit(shot, kit);
  } else {
    html += '<div class="compose-hint"><b>The exact steps:</b></div>';
    html += '<ol class="compose-steps">';
    html += '<li>Click <b>Copy prompt</b> below, then <b>Open Runway</b> and pick <b>Image Tool</b> or <b>Scene Builder</b>.</li>';
    html += '<li>Attach character references and tag them <code>' + esc(chars.map(function(c){return '@'+c.toLowerCase();}).join(' ') || '(none)') + '</code>';
    if (scene) html += ' plus scene <code>@' + esc(scene) + '</code>';
    html += '. Paste the prompt. Generate until it looks right (~30s).</li>';
    html += '<li><b>Right-click the result image → Save Image As</b> → save into your Drive folder. <span class="compose-warn">Do NOT use Runway\'s "Share with anyone" link — that\'s a webpage, not an image, and the runner can\'t fetch it.</span></li>';
    html += '<li>Open the file in Drive, copy its <b>file ID</b> from the URL (the long string between <code>/d/</code> and <code>/view</code>).</li>';
    html += '<li>Paste the file ID below and click <b>Apply Keyframe</b>.</li>';
    html += '</ol>';
  }

  html += '<div class="compose-section-label">Prompt (copy into Runway)</div>';
  html += '<div class="compose-prompt" id="compose-prompt-' + shot.id + '">' + esc(prompt) + '</div>';
  html += '<div class="compose-row">';
  html += '<button class="btn-copy" onclick="copyComposePrompt(\'' + shot.id + '\')">Copy prompt</button>';
  html += '<a class="btn-runway" href="https://app.runwayml.com/" target="_blank" rel="noopener">Open Runway →</a>';
  html += '</div>';

  html += '<div class="compose-section-label">Upload PNG (drag-and-drop)</div>';
  html += '<label class="compose-drop" id="compose-drop-' + shot.id + '" ';
  html += 'ondragover="composeDragOver(event,\'' + shot.id + '\')" ';
  html += 'ondragleave="composeDragLeave(event,\'' + shot.id + '\')" ';
  html += 'ondrop="composeDrop(event,\'' + shot.id + '\')">';
  html += '<input type="file" accept="image/png,image/jpeg" onchange="composeFileChosen(event,\'' + shot.id + '\')">';
  html += '<div id="compose-drop-text-' + shot.id + '"><b>Drop a PNG here</b> (or click to choose) — uploads to Drive and locks it as the keyframe.</div>';
  html += '</label>';

  html += '<div class="compose-or">— or —</div>';

  html += '<div class="compose-section-label">Drive file ID (or direct image URL)</div>';
  html += '<div class="compose-row">';
  html += '<input class="compose-input" id="compose-input-' + shot.id + '" ';
  html += 'placeholder="Drive file ID — e.g. 1AbCDeFG12345... (NOT a Runway share link)"';
  if (existing) html += ' value="' + esc(existing) + '"';
  html += '>';
  html += '<button class="btn-apply" id="compose-apply-' + shot.id + '" onclick="applyKeyframe(\'' + shot.id + '\',this)">Apply Keyframe</button>';
  html += '</div>';
  html += '<div class="compose-fineprint">Accepts: Drive file ID, <code>https://drive.google.com/file/d/&lt;ID&gt;/view</code>, <code>https://lh3.googleusercontent.com/d/&lt;ID&gt;</code>, <code>runway://upload/&lt;id&gt;</code>, or any direct PNG/JPG URL. Does NOT accept Runway creation/share pages (<code>app.runwayml.com/creation/...</code>) — those are webpages.</div>';

  html += '<div class="compose-meta" style="margin-top:10px">';
  html += '<b>Characters:</b> ' + esc(chars.join(', ') || '(none)');
  if (scene) html += '  •  <b>Scene:</b> @' + esc(scene);
  html += '</div>';
  html += '</div>';
  return html;
}

function renderCompositionKit(shot, kit) {
  var html = '<div class="kit-section">';
  html += '<div class="kit-title">Composition Kit — assembled by the runner. Combine in Photopea/Photoshop.</div>';
  html += '<div class="kit-grid">';

  // Backdrop first
  if (kit.backdrop_url) {
    html += '<div class="kit-asset">';
    html += '<img src="' + esc(kit.backdrop_url) + '" onclick="window.open(\'' + esc(kit.backdrop_url) + '\',\'_blank\')" alt="backdrop">';
    html += '<div class="kit-label">Backdrop</div>';
    html += '</div>';
  }

  // Per-character solo stills
  var characters = kit.characters || [];
  for (var i = 0; i < characters.length; i++) {
    var c = characters[i];
    html += '<div class="kit-asset">';
    if (c.url) {
      html += '<img src="' + esc(c.url) + '" onclick="window.open(\'' + esc(c.url) + '\',\'_blank\')" alt="' + esc(c.name) + '">';
    } else {
      html += '<div class="kit-failed">' + esc(c.name) + ' failed: ' + esc((c.error || 'no output').substring(0, 60)) + '</div>';
    }
    html += '<div class="kit-label">' + esc(c.name) + '</div>';
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="kit-actions">';
  html += '<a class="btn-kit-photopea" href="https://www.photopea.com" target="_blank" rel="noopener">Open Photopea →</a>';
  html += '<button class="btn-kit-copy" onclick="copyKitUrls(\'' + shot.id + '\')">Copy all asset URLs</button>';
  if (kit.generated_at) {
    html += '<span style="font-size:10px;color:#8a7060;margin-left:8px;align-self:center">generated ' + new Date(kit.generated_at).toLocaleString() + '</span>';
  }
  html += '</div>';

  html += '<div class="compose-hint" style="margin-top:12px"><b>How to use:</b> open Photopea (free, in-browser). File → Open URL → paste the backdrop. Then File → Open URL again for each character; cut them out (magic wand on the plain background, delete) and drag onto the backdrop. Save as PNG. Drop the result in the upload area below.</div>';
  html += '</div>';
  return html;
}

function copyKitUrls(shotId) {
  var shot = (allData.shots || []).find(function(s){ return s.id === shotId; });
  if (!shot || !shot.composition_kit) { toast('No kit for this shot', 'error'); return; }
  var kit = shot.composition_kit;
  var lines = [];
  if (kit.backdrop_url) lines.push('Backdrop: ' + kit.backdrop_url);
  for (var i = 0; i < (kit.characters || []).length; i++) {
    var c = kit.characters[i];
    if (c.url) lines.push(c.name + ': ' + c.url);
  }
  navigator.clipboard.writeText(lines.join('\n')).then(
    function(){ toast(lines.length + ' kit URLs copied'); },
    function(){ toast('Copy failed', 'error'); }
  );
}

function copyComposePrompt(shotId) {
  var el = document.getElementById('compose-prompt-' + shotId);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(
    function(){ toast('Prompt copied'); },
    function(){ toast('Copy failed', 'error'); }
  );
}

function applyKeyframe(shotId, btn) {
  var input = document.getElementById('compose-input-' + shotId);
  var val = (input && input.value || '').trim();
  if (!val) { toast('Paste a Drive file ID or URL first', 'error'); return; }
  // Reject Runway webpage URLs upfront — they're HTML, not images, and the
  // runner can't fetch them. Save the user a 3-attempt failure cycle.
  if (/app\.runwayml\.com\/(creation|video-tools|ai-tools|gen|tasks)\//.test(val)) {
    toast('That\'s a Runway webpage URL, not an image. Save the image to Drive and paste the file ID instead.', 'error');
    return;
  }
  if (btn) btn.disabled = true;
  apiCall({ action: 'set_keyframe', shot_id: shotId, keyframe_image_url: val })
    .then(function(resp){
      if (resp && resp.render_triggered) toast('Keyframe locked — render started, ~3 min');
      else toast('Keyframe locked — cron will render within 5 min');
      loadData();
    })
    .catch(function(err){
      if (btn) btn.disabled = false;
      toast('Apply failed: ' + err.message, 'error');
    });
}

function composeDragOver(e, shotId) {
  e.preventDefault();
  var el = document.getElementById('compose-drop-' + shotId);
  if (el) el.classList.add('dragover');
}
function composeDragLeave(e, shotId) {
  e.preventDefault();
  var el = document.getElementById('compose-drop-' + shotId);
  if (el) el.classList.remove('dragover');
}
function composeDrop(e, shotId) {
  e.preventDefault();
  var el = document.getElementById('compose-drop-' + shotId);
  if (el) el.classList.remove('dragover');
  var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) uploadKeyframeFile(shotId, file);
}
function composeFileChosen(e, shotId) {
  var file = e.target && e.target.files && e.target.files[0];
  if (file) uploadKeyframeFile(shotId, file);
}

function uploadKeyframeFile(shotId, file) {
  var textEl = document.getElementById('compose-drop-text-' + shotId);
  if (!/^image\//.test(file.type)) {
    toast('Drop a PNG or JPG, not ' + (file.type || 'this file type'), 'error');
    return;
  }
  if (textEl) textEl.innerHTML = '<span class="compose-uploading">Uploading ' + esc(file.name) + ' to Drive…</span>';

  var reader = new FileReader();
  reader.onload = function() {
    // FileReader gives a data URI. Strip the prefix to get raw base64.
    var dataUri = reader.result || '';
    var commaIdx = dataUri.indexOf(',');
    var base64 = commaIdx >= 0 ? dataUri.substring(commaIdx + 1) : '';
    apiCall({
      action: 'upload_keyframe',
      shot_id: shotId,
      filename: file.name || ('keyframe_' + Date.now() + '.png'),
      content_base64: base64,
      mime_type: file.type || 'image/png',
    }).then(function(resp) {
      if (resp && resp.render_triggered) toast('Uploaded → keyframe locked → render started');
      else toast('Uploaded → keyframe locked');
      loadData();
    }).catch(function(err) {
      if (textEl) textEl.innerHTML = '<b>Drop a PNG here</b> (or click to choose)';
      toast('Upload failed: ' + err.message, 'error');
    });
  };
  reader.onerror = function() {
    if (textEl) textEl.innerHTML = '<b>Drop a PNG here</b> (or click to choose)';
    toast('Could not read file', 'error');
  };
  reader.readAsDataURL(file);
}

function recomposeFromModal(shotId) {
  if (!confirm('Clear the locked keyframe? This shot will go back to needs_keyframe and you\'ll compose a new still in Runway.')) return;
  apiCall({ action: 'clear_keyframe', shot_id: shotId })
    .then(function(){
      closeModal();
      toast('Keyframe cleared — see the Compose Keyframe card');
      loadData();
    })
    .catch(function(err){ toast('Recompose failed: ' + err.message, 'error'); });
}

function recomposeKeyframe(shotId) {
  if (!confirm('Clear the locked keyframe and recompose? You\'ll need to make a new still in Runway.')) return;
  apiCall({ action: 'clear_keyframe', shot_id: shotId })
    .then(function(){
      toast('Keyframe cleared — compose a new one');
      loadData();
    })
    .catch(function(err){ toast(err.message, 'error'); });
}

// ── Video expiry ──
function showExpiry(videoEl) {
  var warning = videoEl.parentElement.querySelector('.expiry-warning');
  if (warning) warning.classList.add('show');
}

function refreshRun(runId, warningEl) {
  warningEl.textContent = 'loading Drive copy…';
  warningEl.style.pointerEvents = 'none';
  apiCall({ action: 'refresh_run', run_id: runId }).then(function(resp) {
    var card = document.getElementById('run-' + runId);
    var video = card.querySelector('video');
    if (video) {
      var iframe = document.createElement('iframe');
      iframe.src = resp.preview_url;
      iframe.className = 'drive-iframe';
      iframe.allow = 'autoplay';
      video.replaceWith(iframe);
    }
    warningEl.remove();
    toast('Loaded from Drive');
  }).catch(function(err) {
    warningEl.textContent = 'refresh failed: ' + err.message;
    warningEl.style.pointerEvents = 'auto';
    toast(err.message, 'error');
  });
}

// ── Copy Drive URL ──
function copyDriveInfo(btn) {
  var card = btn.closest('.video-card');
  var url = card.getAttribute('data-drive-folder-url');
  var filename = card.getAttribute('data-drive-filename');
  var text = url || filename || '';
  if (!text) { toast('No Drive info available', 'error'); return; }
  navigator.clipboard.writeText(text).then(
    function() { toast('Copied: ' + (url ? 'Drive folder URL' : filename)); },
    function() { toast('Copy failed', 'error'); }
  );
}

// ── Toggle sections ──
function toggleNext(btn) {
  var el = btn.nextElementSibling;
  if (el) el.classList.toggle('open');
}

// ── Download CapCut assembly manifest (in editorial order) ──
function downloadApproved() {
  // Build the manifest from the data, not the DOM, so we can preserve scene
  // order, shot_order, target durations, and the per-shot capcut_notes.
  var songMap = {};
  for (var i = 0; i < (allData.songs || []).length; i++) songMap[allData.songs[i].id] = allData.songs[i].song_title;

  var approved = (allData.shots || []).filter(function(s){ return s.status === 'approved'; });
  if (!approved.length) { toast('No approved shots', 'error'); return; }

  // Sort: song → scene → shot_order → created_at
  approved.sort(function(a, b){
    var pad = function(v){ return v != null ? String(v).padStart(6,'0') : '￿'; };
    var sa = (a.song_id || '') + ' ' + pad(a.scene_index) + ' ' + (a.scene_id || '￿') + ' ' + pad(a.shot_order) + ' ' + (a.created_at || '');
    var sb = (b.song_id || '') + ' ' + pad(b.scene_index) + ' ' + (b.scene_id || '￿') + ' ' + pad(b.shot_order) + ' ' + (b.created_at || '');
    return sa < sb ? -1 : sa > sb ? 1 : 0;
  });

  // Group runs by shot id (we'll pick the most recently completed run per shot).
  var runsByShot = {};
  for (var i = 0; i < (allData.runs || []).length; i++) {
    var r = allData.runs[i];
    if (!r.video_url) continue;
    var bucket = runsByShot[r.production_queue_id] = runsByShot[r.production_queue_id] || [];
    bucket.push(r);
  }
  for (var k in runsByShot) {
    runsByShot[k].sort(function(a,b){ return (b.created_at || '').localeCompare(a.created_at || ''); });
  }

  var lines = [];
  lines.push('CAPCUT ASSEMBLY MANIFEST');
  lines.push('Generated: ' + new Date().toISOString());
  lines.push('Approved shots: ' + approved.length);
  lines.push('');
  lines.push('Assembly order: top-to-bottom. Each shot trim-to length is the editorial target.');
  lines.push('=' + new Array(78).join('='));

  var lastSong = null, lastScene = null, totalSec = 0, idx = 0;
  for (var i = 0; i < approved.length; i++) {
    var s = approved[i];
    var song = songMap[s.song_id] || 'Unknown song';
    if (song !== lastSong) {
      lines.push('');
      lines.push('### SONG: ' + song);
      lastSong = song; lastScene = null;
    }
    var sceneLabel = s.scene_id ? ('Scene ' + ((s.scene_index != null) ? (s.scene_index + 1) : s.scene_id.substring(0,8))) : 'Unscheduled';
    if (sceneLabel !== lastScene) {
      lines.push('');
      lines.push('  ── ' + sceneLabel + ' ──');
      lastScene = sceneLabel;
    }

    idx += 1;
    var dur = s.target_duration_seconds || s.duration_seconds || 0;
    totalSec += Number(dur) || 0;
    var pos = String(idx).padStart(2, '0');
    var run = (runsByShot[s.id] || [])[0];
    var driveName = run && run.drive_filename ? run.drive_filename : '(no Drive file)';

    lines.push('  ' + pos + '. [' + (s.shot_type || '?') + '] ' + (s.shot_name || '') + '  →  trim to ' + (dur || '?') + 's');
    lines.push('       file: ' + driveName);
    if (s.scene_ref) lines.push('       scene_ref: @' + s.scene_ref);
    if (s.characters_used) lines.push('       characters: ' + s.characters_used);
    if (s.capcut_notes) {
      var notes;
      try { notes = (typeof s.capcut_notes === 'string') ? JSON.parse(s.capcut_notes) : s.capcut_notes; }
      catch(e) { notes = s.capcut_notes; }
      if (notes && typeof notes === 'object') {
        for (var key in notes) {
          if (notes.hasOwnProperty(key) && notes[key]) {
            var v = (typeof notes[key] === 'string') ? notes[key] : JSON.stringify(notes[key]);
            lines.push('       ' + key + ': ' + v);
          }
        }
      } else if (notes) {
        lines.push('       notes: ' + notes);
      }
    }
  }
  lines.push('');
  lines.push('=' + new Array(78).join('='));
  lines.push('TOTAL TARGET RUNTIME: ' + Math.round(totalSec) + 's');

  var blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'capcut-assembly-manifest.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Manifest downloaded — ' + approved.length + ' shots in order');
}

// ── Init ──
loadData();
startAutoRefresh();
</script>
